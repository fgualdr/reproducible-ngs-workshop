project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - days/*.qmd
    - modules/*.qmd
    - backends/*.qmd
    - scripts/README.md
    - checkpoints/README.md
    - assessments/submission_checklist.md
    - student_repo_template/README.md
    - release_workflow.md
    - "!docs/**"

website:
  title: "Reproducible NGS Data Analysis on Personal Laptops"
  site-url: "https://fgualdr.github.io/Reproducible_NGS_Workshop/"
  repo-url: "https://github.com/fgualdr/Reproducible_NGS_Workshop"
  repo-actions: [source, issue]
  page-footer:
    left: "Author: Francesco Gualdrini"
    right: "Source: [github.com/fgualdr/Reproducible_NGS_Workshop](https://github.com/fgualdr/Reproducible_NGS_Workshop)"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Day-by-day lessons"
        contents:
          - text: "Day 0 - Setup"
            href: days/day0_setup.qmd
          - text: "Day 1 - Reproducible project"
            href: days/day1_reproducible_project.qmd
          - text: "Day 2 - RNA-seq"
            href: days/day2_rnaseq.qmd
          - text: "Day 3 - ChIP-seq"
            href: days/day3_chipseq.qmd
          - text: "Day 4 - Integration"
            href: days/day4_integration.qmd
      - section: "Core modules"
        contents:
          - modules/git_github.qmd
          - modules/containers_docker_podman.qmd
          - modules/public_data_retrieval.qmd
          - modules/reference_genomes.qmd
          - modules/rnaseq_concepts.qmd
          - modules/chipseq_concepts.qmd
          - modules/genomic_intervals.qmd
          - modules/execution_backends.qmd
      - section: "Execution backends"
        contents:
          - backends/local_docker_podman.qmd
          - backends/github_codespaces.qmd
          - backends/galaxy_optional_demo.qmd
          - backends/instructor_machine_or_vm.qmd
          - backends/checkpoint_mode.qmd
      - text: "Scripts"
        href: scripts/README.md
      - text: "Checkpoints"
        href: checkpoints/README.md
      - text: "Assessment"
        href: assessments/submission_checklist.md
      - text: "Student repo template"
        href: student_repo_template/README.md
      - text: "GitHub release workflow"
        href: release_workflow.md

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    css: assets/css/styles.css

execute:
  freeze: auto
  eval: false
