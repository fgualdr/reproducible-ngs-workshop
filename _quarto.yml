project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - "!docs/**"

profile:
  default: day4
  group:
    - [day0, day1, day2, day3, day4]

website:
  title: "Reproducible NGS Data Analysis"
  site-url: "https://fgualdr.github.io/reproducible-ngs-workshop/"
  repo-url: "https://github.com/fgualdr/reproducible-ngs-workshop"
  page-footer:
    left: "Author: Francesco Gualdrini"
    right: "Source: [github.com/fgualdr/reproducible-ngs-workshop](https://github.com/fgualdr/reproducible-ngs-workshop)"
  sidebar:
    style: docked
    search: true
    contents:
      - text: "Home"
        href: index.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    css: assets/css/styles.css

execute:
  freeze: auto
  eval: false
