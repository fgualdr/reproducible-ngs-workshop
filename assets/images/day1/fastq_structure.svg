<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="60" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#1f2937">FASTQ: one sequencing read uses four lines</text>
  <rect x="90" y="120" width="1020" height="260" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="130" y="170" font-family="Courier New" font-size="22" fill="#1d4ed8">@read_id instrument:run:flowcell:lane:tile:x:y</text>
  <text x="130" y="215" font-family="Courier New" font-size="22" fill="#047857">ACGTTGACCTAGCTAGCTAG...</text>
  <text x="130" y="260" font-family="Courier New" font-size="22" fill="#92400e">+</text>
  <text x="130" y="305" font-family="Courier New" font-size="22" fill="#7c3aed">IIIIIIHHHHHGGGGFFFFF...</text>
  <text x="780" y="170" font-family="Arial" font-size="18" fill="#374151">1. read identifier</text>
  <text x="780" y="215" font-family="Arial" font-size="18" fill="#374151">2. nucleotide sequence</text>
  <text x="780" y="260" font-family="Arial" font-size="18" fill="#374151">3. separator line</text>
  <text x="780" y="305" font-family="Arial" font-size="18" fill="#374151">4. base quality scores</text>
  <text x="90" y="430" font-family="Arial" font-size="20" fill="#374151">In terminal: use zcat + head to inspect compressed FASTQ files without opening them in a text editor.</text>
</svg>
