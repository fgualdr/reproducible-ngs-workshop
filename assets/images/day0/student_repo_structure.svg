<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Student repository folder structure">
  <defs><style>.title{font:700 32px Arial,sans-serif;fill:#263047}.t{font:400 20px Menlo,Consolas,monospace;fill:#263047}.note{font:400 17px Arial,sans-serif;fill:#4f5e73}.box{fill:#fff;stroke:#c8d7e8;stroke-width:2;rx:24}</style></defs>
  <rect width="1000" height="620" fill="#f7fbff"/>
  <text class="title" x="70" y="62">Your student repository</text>
  <rect class="box" x="70" y="100" width="860" height="430"/>
  <text class="t" x="110" y="155">student-ngs-project/</text>
  <text class="t" x="140" y="195">├── README.md</text>
  <text class="t" x="140" y="235">├── code/</text>
  <text class="t" x="170" y="275">│   ├── day1/</text>
  <text class="t" x="170" y="315">│   ├── day2_rnaseq/</text>
  <text class="t" x="170" y="355">│   └── day3_chipseq/</text>
  <text class="t" x="140" y="395">├── container/</text>
  <text class="t" x="140" y="435">├── data/     # ignored large local files</text>
  <text class="t" x="140" y="475">└── results/  # small outputs, plots, logs</text>
  <text class="note" x="70" y="575">Keep this repository simple: README, code, container recipes, local data, and selected results.</text>
</svg>
