<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">ChIP-seq concept flow</title>
  <desc id="desc">ChIP-seq workflow showing IP and input reads mapped to the genome and compared to call peaks and make tracks.</desc>
  <rect width="1200" height="450" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:8}
    .ip{fill:#fee2e2}
    .input{fill:#e0f2fe}
    .tool{fill:#ecfdf5}
    .result{fill:#fff7ed}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#0f172a}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#334155}
    .arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <text x="40" y="42" class="txt" font-weight="700">ChIP-seq: enrichment over background</text>
  <rect x="55" y="90" width="185" height="90" class="box ip"/>
  <text x="147" y="126" text-anchor="middle" class="txt">IP FASTQ</text>
  <text x="147" y="154" text-anchor="middle" class="small">protein-bound DNA</text>
  <rect x="55" y="250" width="185" height="90" class="box input"/>
  <text x="147" y="286" text-anchor="middle" class="txt">Input FASTQ</text>
  <text x="147" y="314" text-anchor="middle" class="small">background DNA</text>
  <line x1="240" y1="135" x2="315" y2="135" class="arrow"/>
  <line x1="240" y1="295" x2="315" y2="295" class="arrow"/>
  <rect x="315" y="90" width="190" height="90" class="box tool"/>
  <text x="410" y="126" text-anchor="middle" class="txt">Map IP</text>
  <text x="410" y="154" text-anchor="middle" class="small">Bowtie2 + samtools</text>
  <rect x="315" y="250" width="190" height="90" class="box tool"/>
  <text x="410" y="286" text-anchor="middle" class="txt">Map input</text>
  <text x="410" y="314" text-anchor="middle" class="small">same reference</text>
  <line x1="505" y1="135" x2="590" y2="200" class="arrow"/>
  <line x1="505" y1="295" x2="590" y2="240" class="arrow"/>
  <rect x="590" y="170" width="210" height="100" class="box tool"/>
  <text x="695" y="207" text-anchor="middle" class="txt">MACS3</text>
  <text x="695" y="235" text-anchor="middle" class="small">find enriched intervals</text>
  <line x1="800" y1="220" x2="870" y2="220" class="arrow"/>
  <rect x="870" y="90" width="250" height="90" class="box result"/>
  <text x="995" y="126" text-anchor="middle" class="txt">narrowPeak</text>
  <text x="995" y="154" text-anchor="middle" class="small">candidate binding sites</text>
  <rect x="870" y="250" width="250" height="90" class="box result"/>
  <text x="995" y="286" text-anchor="middle" class="txt">bigWig tracks</text>
  <text x="995" y="314" text-anchor="middle" class="small">visual signal profiles</text>
  <line x1="800" y1="230" x2="870" y2="285" class="arrow"/>
  <text x="55" y="402" class="small">Key idea: peaks are places where IP coverage is higher than expected background. Input control helps avoid calling accessible or biased regions as binding sites.</text>
</svg>
