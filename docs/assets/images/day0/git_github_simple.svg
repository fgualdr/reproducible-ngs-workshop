<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Simple Git and GitHub workflow for students">
  <defs>
    <style>.title{font:700 34px Arial,sans-serif;fill:#20283a}.label{font:700 22px Arial,sans-serif;fill:#20283a}.t{font:400 17px Arial,sans-serif;fill:#3e4c63}.box{fill:#fff;stroke:#c9d7ed;stroke-width:2;rx:24}.cmd{fill:#f2f5ff;stroke:#94a9dc;stroke-width:1.5;rx:16}.arrow{stroke:#6e7fb0;stroke-width:4;fill:none;marker-end:url(#arr)}</style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6e7fb0"/></marker>
  </defs>
  <rect width="1200" height="430" fill="#f8fbff"/>
  <text class="title" x="60" y="58">Daily Git workflow</text>
  <rect class="box" x="60" y="105" width="210" height="210"/><text class="label" x="100" y="155">1. Edit</text><text class="t" x="92" y="192">README</text><text class="t" x="92" y="222">.sh scripts</text><text class="t" x="92" y="252">.R scripts</text>
  <rect class="box" x="330" y="105" width="210" height="210"/><text class="label" x="370" y="155">2. Check</text><rect class="cmd" x="365" y="185" width="140" height="44"/><text class="t" x="392" y="213">git status</text>
  <rect class="box" x="600" y="105" width="210" height="210"/><text class="label" x="638" y="155">3. Save</text><rect class="cmd" x="635" y="185" width="140" height="44"/><text class="t" x="666" y="213">git add</text><rect class="cmd" x="635" y="240" width="140" height="44"/><text class="t" x="650" y="268">git commit</text>
  <rect class="box" x="870" y="105" width="260" height="210"/><text class="label" x="920" y="155">4. Upload</text><rect class="cmd" x="930" y="185" width="140" height="44"/><text class="t" x="964" y="213">git push</text><text class="t" x="910" y="265">copy on GitHub</text>
  <path class="arrow" d="M270 210 L330 210"/><path class="arrow" d="M540 210 L600 210"/><path class="arrow" d="M810 210 L870 210"/>
  <text class="t" x="60" y="370">Keep commits small and messages meaningful. Example: "Add Day 0 setup notes".</text>
</svg>
