<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Two layers of reproducibility: workflow tracking with Git and software environment tracking with containers">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f7f5ff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <style>
      .title{font:700 34px Arial, sans-serif; fill:#263047}.h{font:700 24px Arial, sans-serif; fill:#263047}.t{font:400 18px Arial, sans-serif; fill:#263047}.small{font:400 15px Arial, sans-serif; fill:#40506a}.box{fill:white;stroke:#c9d6ea;stroke-width:2;rx:22}.pill{fill:#eef2ff;stroke:#8da2d8;stroke-width:1.5;rx:18}.arrow{stroke:#6d7fae;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6d7fae"/></marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text class="title" x="70" y="65">Reproducibility in this workshop</text>
  <text class="t" x="70" y="100">We track both the analysis steps and the computational environment.</text>
  <rect class="box" x="70" y="145" width="500" height="295"/>
  <text class="h" x="110" y="195">Layer 1: workflow tracking</text>
  <text class="t" x="110" y="235">What did we do to the data?</text>
  <rect class="pill" x="110" y="265" width="145" height="48"/><text class="small" x="137" y="295">README</text>
  <rect class="pill" x="275" y="265" width="145" height="48"/><text class="small" x="315" y="295">scripts</text>
  <rect class="pill" x="440" y="265" width="90" height="48"/><text class="small" x="466" y="295">Git</text>
  <text class="small" x="110" y="350">Examples: download commands, file names, parameters, notes, commits.</text>
  <text class="small" x="110" y="380">Output: a traceable history of the workflow.</text>
  <rect class="box" x="630" y="145" width="500" height="295"/>
  <text class="h" x="670" y="195">Layer 2: tool/version tracking</text>
  <text class="t" x="670" y="235">Which software environment ran the steps?</text>
  <rect class="pill" x="670" y="265" width="150" height="48"/><text class="small" x="700" y="295">images</text>
  <rect class="pill" x="840" y="265" width="150" height="48"/><text class="small" x="873" y="295">Podman</text>
  <rect class="pill" x="1010" y="265" width="90" height="48"/><text class="small" x="1029" y="295">tags</text>
  <text class="small" x="670" y="350">Examples: R, Bioconductor, STAR, BWA, MACS3, bedtools.</text>
  <text class="small" x="670" y="380">Output: analyses can be re-run with the same tool versions.</text>
  <path class="arrow" d="M570 292 C595 292 605 292 630 292"/>
</svg>
