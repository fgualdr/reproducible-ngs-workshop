<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">RNA-seq and ChIP-seq integration concept</title>
  <desc id="desc">Integration workflow combining differential expression, peaks, and gene annotation to generate candidate direct targets.</desc>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#334155;stroke-width:2;rx:8}
    .rna{fill:#e0f2fe}
    .chip{fill:#fee2e2}
    .anno{fill:#ecfdf5}
    .result{fill:#fff7ed}
    .txt{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#0f172a}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#334155}
    .arrow{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <text x="40" y="42" class="txt" font-weight="700">Integration: expression change plus nearby binding evidence</text>
  <rect x="60" y="90" width="250" height="80" class="box rna"/>
  <text x="185" y="122" text-anchor="middle" class="txt">DESeq2 results</text>
  <text x="185" y="150" text-anchor="middle" class="small">genes with expression changes</text>
  <rect x="60" y="220" width="250" height="80" class="box chip"/>
  <text x="185" y="252" text-anchor="middle" class="txt">ChIP-seq peaks</text>
  <text x="185" y="280" text-anchor="middle" class="small">candidate binding intervals</text>
  <rect x="60" y="340" width="250" height="60" class="box anno"/>
  <text x="185" y="378" text-anchor="middle" class="txt">Gene annotation</text>
  <line x1="310" y1="130" x2="430" y2="205" class="arrow"/>
  <line x1="310" y1="260" x2="430" y2="235" class="arrow"/>
  <line x1="310" y1="370" x2="430" y2="260" class="arrow"/>
  <rect x="430" y="175" width="285" height="110" class="box anno"/>
  <text x="572" y="214" text-anchor="middle" class="txt">GenomicRanges</text>
  <text x="572" y="244" text-anchor="middle" class="small">nearest genes, promoter windows,</text>
  <text x="572" y="268" text-anchor="middle" class="small">overlaps, distances</text>
  <line x1="715" y1="230" x2="825" y2="230" class="arrow"/>
  <rect x="825" y="105" width="300" height="95" class="box result"/>
  <text x="975" y="142" text-anchor="middle" class="txt">Candidate direct targets</text>
  <text x="975" y="170" text-anchor="middle" class="small">DE gene + nearby peak</text>
  <rect x="825" y="260" width="300" height="95" class="box result"/>
  <text x="975" y="297" text-anchor="middle" class="txt">Limitations</text>
  <text x="975" y="325" text-anchor="middle" class="small">nearby is not proof of regulation</text>
  <line x1="715" y1="240" x2="825" y2="300" class="arrow"/>
</svg>
